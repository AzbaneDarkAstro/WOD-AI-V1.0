[app]
title = WOD AI
package.name = wodai
package.domain = org.wod
source.dir = .
source.include_exts = py,png,jpg,kv,atlas,ttf,json
version = 1.1
requirements = python3,kivy==2.3.0,openssl,certifi,arabic-reshaper,python-bidi==0.4.2
orientation = portrait
fullscreen = 0
android.permissions = INTERNET,RECORD_AUDIO
android.api = 33
android.minapi = 24
android.archs = arm64-v8a
android.accept_sdk_license = True

[buildozer]
log_level = 2
warn_on_root = 1
